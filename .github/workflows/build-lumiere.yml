name: Build Lumiere Split JS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download Folia source
        run: |
          curl -L https://github.com/chthollyphile/folia-major/archive/refs/heads/main.zip -o folia.zip
          unzip -q folia.zip
          mv folia-major-main folia

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Esbuild
        run: |
          cd folia
          npm install
          cd ..
          npm install -g esbuild

      - name: Create Dummy File
        run: echo "export default {};" > folia/empty.js

      - name: Patch Source Code via Shell
        run: |
          # 直接用最简单的 grep 和 sed 替换掉 import.meta.glob
          grep -rl "import.meta.glob" folia/src | xargs sed -i 's/import\.meta\.glob(\(.*\))/(()=>({}))/g' || true

      - name: Create Entry Files
        run: |
          mkdir -p output
          # Pixi 独立包
          echo 'export * from "pixi.js";' > folia/src/components/visualizer/lumiere/bundle-pixi.ts
          
          # Lumiere 业务包
          cat << 'EOF' > folia/src/components/visualizer/lumiere/bundle-lumiere.ts
          import { LumierePixiRuntime } from "./createLumierePixiRuntime";
          import { compileLumiereProgram } from "./lumiereProgram";
          import { resolveLumiereCompileOptions } from "./lumiereRuntimeTuning";
          import { DEFAULT_LUMIERE_TUNING } from "../../../types";
          (window as any).LumiereRuntime = { LumierePixiRuntime, compileLumiereProgram, resolveLumiereCompileOptions, DEFAULT_LUMIERE_TUNING };
          EOF

      - name: Build Pixi JS
        run: |
          npx esbuild folia/src/components/visualizer/lumiere/bundle-pixi.ts \
            --bundle --format=iife --global-name=PIXI --platform=browser --target=es2020 \
            --tree-shaking=true --minify --outfile=output/lumiere-pixi.js

      - name: Build Lumiere JS
        run: |
          npx esbuild folia/src/components/visualizer/lumiere/bundle-lumiere.ts \
            --bundle --format=iife --platform=browser --target=es2020 \
            --tree-shaking=true --minify --loader:.tsx=tsx --loader:.ts=ts --loader:.json=json \
            --define:process.env.NODE_ENV='"production"' \
            --define:import.meta='{}' \
            --alias:virtual:folia-locale-zh-TW=./folia/empty.js \
            --external:pixi.js \
            --external:react \
            --external:react-dom \
            --external:framer-motion \
            --external:react-i18next \
            --external:lucide-react \
            --banner:js="var require = function(m) { if (m === 'pixi.js' || m.indexOf('@pixi/') === 0) return window.PIXI; if (m === 'lucide-react') return new Proxy({}, {get:function(){return function(){return {props:{}}}}}); if (m === 'react' || m === 'react/jsx-runtime') return {createElement:function(){return {props:{}}}, jsx:function(){return {props:{}}}, jsxs:function(){return {props:{}}}, Fragment:{}, Component:function(){}, useCallback:function(f){return f}, useEffect:function(){}, useRef:function(v){return {current:v}}, useState:function(v){return [v,function(){}]}, useMemo:function(f){return f()}}; return {}; };" \
            --outfile=output/lumiere.js

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumiere-bundle
          path: |
            output/lumiere-pixi.js
            output/lumiere.js
