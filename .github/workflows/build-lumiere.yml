name: Build Lumiere Split JS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download Folia source
        run: |
          curl -L https://github.com/chthollyphile/folia-major/archive/refs/heads/main.zip -o folia.zip
          unzip -q folia.zip
          mv folia-major-main folia

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Esbuild
        run: |
          cd folia
          npm install
          cd ..
          npm install -g esbuild

      - name: Create Dummy File
        run: echo "export default {};" > folia/empty.js

      - name: Patch Source Code via Node
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            function walk(dir) {
                let results = [];
                const list = fs.readdirSync(dir);
                list.forEach(file => {
                    file = path.join(dir, file);
                    const stat = fs.statSync(file);
                    if (stat && stat.isDirectory()) { results = results.concat(walk(file)); }
                    else { results.push(file); }
                });
                return results;
            }
            walk('folia/src').forEach(file => {
                if (file.endsWith('.ts') || file.endsWith('.tsx')) {
                    let content = fs.readFileSync(file, 'utf8');
                    if (content.includes('import.meta.glob')) {
                        content = content.replace(/import\.meta\.glob(?:<[^>]+>)?\([^)]*\)/g, '(()=>({}))');
                        fs.writeFileSync(file, content);
                    }
                }
            });
          "

      - name: Create Entry Files
        run: |
          mkdir -p output
          
          # 1. 创建 Vendor 依赖包（包含 React, ReactDOM, FramerMotion）
          cat << 'EOF' > folia/src/components/visualizer/lumiere/bundle-vendor.ts
          import * as React from "react";
          import * as ReactDOM from "react-dom";
          import * as ReactDOMClient from "react-dom/client";
          import * as FramerMotion from "framer-motion";
          
          (window as any).React = React;
          (window as any).ReactDOM = ReactDOM;
          (window as any).ReactDOMClient = ReactDOMClient;
          (window as any).FramerMotion = FramerMotion;
          EOF

          # 2. 创建 Lumiere 业务包
          cat << 'EOF' > folia/src/components/visualizer/lumiere/bundle-lumiere.ts
          import * as M from "./VisualizerLumiere";
          const C = (M as any).default || (M as any).VisualizerLumiere;
          (window as any).LumiereRuntime = { VisualizerLumiere: C };
          EOF

      - name: Build Vendor JS
        run: |
          npx esbuild folia/src/components/visualizer/lumiere/bundle-vendor.ts \
            --bundle --format=iife --platform=browser --target=es2020 \
            --tree-shaking=true --minify --loader:.tsx=tsx --loader:.ts=ts \
            --define:process.env.NODE_ENV='"production"' \
            --outfile=output/lumiere-vendor.js

      - name: Build Lumiere JS
        run: |
          npx esbuild folia/src/components/visualizer/lumiere/bundle-lumiere.ts \
            --bundle --format=iife --platform=browser --target=es2020 \
            --tree-shaking=true --minify --loader:.tsx=tsx --loader:.ts=ts --loader:.json=json \
            --define:process.env.NODE_ENV='"production"' \
            --define:import.meta='{}' \
            --alias:virtual:folia-locale-zh-TW=./folia/empty.js \
            --external:react --external:react-dom --external:react-dom/client --external:framer-motion \
            --banner:js="var require = function(m) { if (m === 'react') return window.React; if (m === 'react-dom') return window.ReactDOM; if (m === 'react-dom/client') return window.ReactDOMClient; if (m === 'framer-motion') return window.FramerMotion; return {}; };" \
            --metafile=output/meta.json \
            --outfile=output/lumiere.js

      - name: Analyze Bundle Size
        run: |
          node -e "
          const m=require('./output/meta.json');
          const ins=Object.values(m.outputs)[0].inputs, by={};
          for(const [f,v] of Object.entries(ins)){
            const p=f.split('/'); const k=f.startsWith('node_modules/')
              ?p.slice(0,p[1].startsWith('@')?3:2).join('/'):p.slice(0,4).join('/');
            by[k]=(by[k]||0)+v.bytesInOutput}
          console.log('====== 体积大头排行 ======');
          console.log(Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0,15)
            .map(([k,v])=>(v/1024|0)+'KB '+k).join('\n'))
          "

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumiere-bundle
          path: |
            output/lumiere-vendor.js
            output/lumiere.js
