- name: Build Lumiere JS
        run: |
          mkdir -p output
          npx esbuild folia/src/components/visualizer/lumiere/bundle-lumiere.ts \
            --bundle \
            --format=iife \
            --platform=browser \
            --target=es2020 \
            --charset=ascii \
            --tree-shaking=true \
            --minify \
            --loader:.tsx=tsx \
            --loader:.ts=ts \
            --loader:.json=json \
            --define:process.env.NODE_ENV='"production"' \
            --define:import.meta='{}' \
            --define:import.meta.glob='()=>{}' \
            --alias:virtual:folia-locale-zh-TW=./folia/empty.js \
            --external:react \
            --external:react-dom \
            --external:react-dom/server \
            --external:react/jsx-runtime \
            --external:framer-motion \
            --external:lucide-react \
            --external:react-i18next \
            --banner:js="var require = function(m) { if (m==='react' || m==='react/jsx-runtime') return {createElement:function(){return {props:{}}}, jsx:function(){return {props:{}}}, jsxs:function(){return {props:{}}}, Fragment:{}, Component:function(){}, useCallback:function(f){return f}, useEffect:function(){}, useRef:function(v){return {current:v}}, useState:function(v){return [v,function(){}]}, useMemo:function(f){return f()}}; if (m==='react-dom' || m==='react-dom/server') return {renderToStaticMarkup:function(){return ''}, render:function(){}}; if (m==='framer-motion') return {motionValue:function(v){return {get:function(){return v}, set:function(){}}}, motion:{div:function(){return {props:{}}}, span:function(){return {props:{}}}}}; if (m==='lucide-react') return new Proxy({}, {get:function(){return function(){return {props:{}}}}}); if (m==='react-i18next') return {useTranslation:function(){return {t:function(k){return k}, i18n:{}}}}; return {}; };" \
            --outfile=output/lumiere.js
