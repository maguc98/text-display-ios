name: Build Partita Bundle

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download Folia
        run: |
          curl -L https://github.com/ithtelab/Folia-Plain/archive/refs/heads/main.zip -o folia.zip
          unzip -q folia.zip
          mv Folia-Plain-main folia

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          cd folia
          npm install --legacy-peer-deps || true
          cd ..
          npm install -g esbuild preact@10.24.3

      - name: Create Shims
        run: |
          mkdir -p shims
          node -e "require('fs').writeFileSync('shims/lucide.cjs', 'var h = require(\"preact\").h; module.exports = new Proxy({}, { get: function() { return function() { return h(\"span\", {}); }; } });')"
          node -e "require('fs').writeFileSync('shims/i18n.cjs', 'module.exports = { useTranslation: function() { return { t: function(k) { return k; }, i18n: {} }; } };')"

      - name: Patch Vite
        run: |
          find folia/src -type f \( -name "*.ts" -o -name "*.tsx" \) -exec sed -i 's/import\.meta\.glob(.*)/(()=>({}))/g' {} + || true

      - name: Build with esbuild
        run: |
          mkdir -p output
          esbuild folia/src/components/visualizer/partita/VisualizerPartita.tsx \
            --bundle \
            --format=iife \
            --global-name=Partita \
            --platform=browser \
            --target=safari14 \
            --jsx=automatic \
            --minify \
            --define:process.env.NODE_ENV='"production"' \
            --alias:react=preact/compat \
            --alias:react-dom=preact/compat \
            --alias:react/jsx-runtime=preact/jsx-runtime \
            --alias:lucide-react="$PWD/shims/lucide.cjs" \
            --alias:react-i18next="$PWD/shims/i18n.cjs" \
            --loader:.css=empty \
            --loader:.png=dataurl \
            --loader:.jpg=dataurl \
            --loader:.svg=dataurl \
            --supported:dynamic-import=false \
            --outfile=output/partita.js

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: partita-bundle
          path: output/partita.js
