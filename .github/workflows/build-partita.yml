
name: Build Partita Split

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-partita.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download Folia-Plain
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            https://github.com/ithtelab/Folia-Plain/archive/41e178bc38597440d64c65bc2ae660ae07cac104.zip \
            -o folia.zip
          unzip -q folia.zip
          mv Folia-Plain-41e178bc38597440d64c65bc2ae660ae07cac104 folia

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd folia
          npm install --legacy-peer-deps --ignore-scripts
          npm install --no-save --legacy-peer-deps preact esbuild framer-motion jsdom
          mkdir -p .my-shims ../output

      - name: Create compatibility shims
        shell: bash
        run: |
          set -euo pipefail
          cd folia

          printf 'export default {};\n' > empty.js

          cat > .my-shims/lucide.cjs <<'EOF'
          module.exports = new Proxy({}, {
            get: function () {
              return function () {
                return null;
              };
            }
          });
          EOF

          cat > .my-shims/opencc.cjs <<'EOF'
          // Lightweight OpenCC compatibility shim.
          // Partita's lyric layout does not require full dictionary conversion.
          // Any requested conversion becomes a pass-through operation.
          const identity = value => value == null ? value : String(value);
          const proxy = new Proxy(function (value) { return identity(value); }, {
            get: function (_target, key) {
              if (key === '__esModule') return true;
              if (key === 'default') return proxy;
              return function () { return identity; };
            },
            apply: function (_target, _thisArg, args) {
              return args.length ? identity(args[0]) : identity;
            },
            construct: function () {
              return function (value) { return identity(value); };
            }
          });
          module.exports = proxy;
          EOF

          cat > .my-shims/i18n.cjs <<'EOF'
          const i18n = {
            t: function (key) { return key; },
            language: 'en',
            resolvedLanguage: 'en',
            on: function () {},
            off: function () {},
            changeLanguage: function () { return Promise.resolve('en'); }
          };

          module.exports = {
            useTranslation: function () {
              return { t: i18n.t, i18n };
            },
            initReactI18next: {
              type: '3rdParty',
              init: function () {}
            },
            getI18n: function () { return i18n; },
            Trans: function (props) { return (props && props.children) || null; },
            I18nextProvider: function (props) { return (props && props.children) || null; }
          };
          EOF

          # Framer Motion is provided once by partita-vendor.js.
          # Do not rewrite source imports to a shim or bundle a second runtime.

          echo "Compatibility shims created."

      - name: Stub Vite-only registries for the standalone Partita bundle
        shell: bash
        run: |
          set -euo pipefail
          cd folia

          # esbuild does not implement Vite's import.meta.glob. Restrict the
          # replacement to source call sites, then provide small registries
          # for this standalone Partita-only bundle.
          find src -type f \( -name "*.ts" -o -name "*.tsx" \) \
            -exec sed -i "s/import\\.meta\\.glob/__folia_glob/g" {} +

          cat > src/components/visualizer/backgrounds/registry.tsx <<'EOF'
          // Standalone bundle registry: retain the expected latent default id,
          // but omit the heavyweight background renderer from this lyric-only build.
          const fallbackEntry: any = {
            mode: 'latent',
            order: 35,
            labelKey: 'options.visualizerBackgroundModeLatent',
            labelFallback: 'Latent',
            render: () => null,
          };
          const byMode: Record<string, any> = { latent: fallbackEntry };
          export const VISUALIZER_BACKGROUND_REGISTRY = [fallbackEntry];
          export const DEFAULT_VISUALIZER_BACKGROUND_MODE = 'latent';
          export const hasVisualizerBackgroundMode = (mode: unknown) =>
            typeof mode === 'string' && Boolean(byMode[mode]);
          export const getVisualizerBackgroundRegistryEntry = (mode: string) =>
            byMode[mode] || fallbackEntry;
          export const getVisualizerBackgroundModeLabel = (mode: string, t: (key: string) => string) => {
            const entry = getVisualizerBackgroundRegistryEntry(mode);
            const translated = t(entry.labelKey);
            return !translated || translated === entry.labelKey ? entry.labelFallback : translated;
          };
          export const appendVisualizerBackgroundEntry = (entry: any) => {
            if (byMode[entry.mode]) return false;
            byMode[entry.mode] = entry;
            VISUALIZER_BACKGROUND_REGISTRY.push(entry);
            VISUALIZER_BACKGROUND_REGISTRY.sort((a: any, b: any) => a.order - b.order);
            return true;
          };
          export const removeVisualizerBackgroundEntry = (mode: string) => {
            if (!byMode[mode]) return false;
            delete byMode[mode];
            const index = VISUALIZER_BACKGROUND_REGISTRY.findIndex((entry: any) => entry.mode === mode);
            if (index >= 0) VISUALIZER_BACKGROUND_REGISTRY.splice(index, 1);
            return true;
          };
          EOF

          cat > src/components/visualizer/registry.tsx <<'EOF'
          // Standalone bundle registry: the host embeds only Partita.
          const fallbackEntry: any = {
            mode: 'partita',
            order: 50,
            labelKey: 'ui.visualizerPartita',
            labelFallback: '云阶',
            previewStartOffset: 0,
            previewSeed: 'partita',
            render: () => null,
          };
          const byMode: Record<string, any> = { partita: fallbackEntry };
          export const VISUALIZER_REGISTRY = [fallbackEntry];
          export const DEFAULT_VISUALIZER_MODE = 'partita';
          export const hasVisualizerMode = (mode: string | null | undefined) =>
            Boolean(mode && byMode[mode]);
          export const getVisualizerRegistryEntry = (mode: string) =>
            byMode[mode] || fallbackEntry;
          export const getVisualizerModeLabel = (mode: string, t: (key: string) => string) => {
            const entry = getVisualizerRegistryEntry(mode);
            const translated = t(entry.labelKey);
            return !translated || translated === entry.labelKey ? entry.labelFallback : translated;
          };
          export const getVisualizerPreviewStartOffset = () => 0;
          export const getVisualizerScopedSeed = (mode: string, scope: string) => `${scope}-${mode}`;
          export const appendVisualizerEntry = () => false;
          export const removeVisualizerEntry = () => false;
          EOF

          echo "Partita-only registries installed."

      - name: Create standalone Partita rendering core
        shell: bash
        run: |
          set -euo pipefail
          cd folia

          # Keep the original Partita layout, timing, word and animation components,
          # but replace its Folia application shell and subtitle overlay with a
          # standalone renderer. The host owns UI text, settings and controls.
          cat > src/components/visualizer/partita/VisualizerPartitaCore.tsx <<'EOF'
          import React, { useMemo, useState, useEffect, useRef } from 'react';
          import { motion, AnimatePresence, useMotionValueEvent, type MotionValue } from 'framer-motion';
          import { DEFAULT_PARTITA_TUNING, type Line, type Theme, type PartitaTuning } from '../../../types';
          import { getLineRenderEndTime } from '../../../utils/lyrics/renderHints';
          import { resolveThemeFontStack } from '../../../utils/fontStacks';
          import { shouldPreheatLine, useVisualizerRuntime } from '../runtime';
          import { buildGlowWordLayoutVariants, glowWordBodyVariants } from '../glowWordVariants';
          import { getGlowWordLineContainerMotion, resolveGlowWordRenderProfile } from '../glowWordTiming';
          import {
            EMPTY_PARTITA_LAYOUT,
            PARTITA_PREHEAT_WINDOW,
            type PartitaSequentialLayout,
            getOrBuildPartitaLayout,
            resolvePartitaTuning,
          } from './partitaLayout';
          import { PartitaChunk } from './PartitaChunk';

          export interface PartitaCoreProps {
            currentTime: MotionValue<number>;
            currentLineIndex: number;
            lines: Line[];
            theme: Theme;
            audioPower?: MotionValue<number>;
            audioBands?: Record<string, MotionValue<number>>;
            showText?: boolean;
            partitaTuning?: PartitaTuning;
            lyricsFontScale?: number;
            [key: string]: any;
          }

          const TEXT_HIDDEN_EXIT = { opacity: 0, transition: { duration: 0.2, ease: 'easeOut' as const } };

          const VisualizerPartitaCore: React.FC<PartitaCoreProps> = (props) => {
            const {
              currentTime,
              currentLineIndex,
              lines,
              theme,
              showText: _showText,
              partitaTuning = DEFAULT_PARTITA_TUNING,
              lyricsFontScale = 1,
            } = props;

            // Only explicit false hides lyrics; null and undefined default to visible.
            const showText = _showText !== false;

            const [windowHeight, setWindowHeight] = useState(800);
            const resolvedPartitaTuning = useMemo(() => resolvePartitaTuning(partitaTuning), [partitaTuning]);
            const layoutCacheRef = useRef<Map<string, PartitaSequentialLayout>>(new Map());

            useEffect(() => {
              setWindowHeight(window.innerHeight);
              const handleResize = () => setWindowHeight(window.innerHeight);
              window.addEventListener('resize', handleResize);
              return () => window.removeEventListener('resize', handleResize);
            }, []);

            const { activeLine, upcomingLine } = useVisualizerRuntime({
              currentTime,
              currentLineIndex,
              lines: Array.isArray(lines) ? lines : [],
              getLineEndTime: getLineRenderEndTime,
            });

            const activeLineRenderProfile = activeLine ? resolveGlowWordRenderProfile(activeLine) : null;
            const activeLineContainerMotion = activeLineRenderProfile
              ? getGlowWordLineContainerMotion(activeLineRenderProfile)
              : { initial: { opacity: 1 }, animate: { opacity: 1 }, exit: { opacity: 0 } };

            const sequentialLayout = useMemo(() => {
              if (!activeLine) return EMPTY_PARTITA_LAYOUT;
              return getOrBuildPartitaLayout(layoutCacheRef.current, activeLine, theme, windowHeight, resolvedPartitaTuning);
            }, [activeLine, theme, windowHeight, resolvedPartitaTuning]);

            const diagnosticColumnCount = sequentialLayout.columns.length;
            const diagnosticChunkCount = sequentialLayout.columns.reduce(
              (total, column) => total + column.words.length,
              0
            );
            const diagnosticDisplayWordCount = sequentialLayout.columns.reduce(
              (total, column) => total + column.words.reduce(
                (count, word) => count + (Array.isArray(word.displayWords) ? word.displayWords.length : 0),
                0
              ),
              0
            );

            const nextLineRef = useRef<Line | null>(upcomingLine);
            useEffect(() => {
              nextLineRef.current = upcomingLine;
            }, [upcomingLine]);

            useMotionValueEvent(currentTime, 'change', (latest: number) => {
              const nextLine = nextLineRef.current;
              if (!nextLine) return;
              if (!shouldPreheatLine(nextLine, latest, PARTITA_PREHEAT_WINDOW)) return;
              getOrBuildPartitaLayout(layoutCacheRef.current, nextLine, theme, windowHeight, resolvedPartitaTuning);
            });

            const densityScale = sequentialLayout.totalGraphemes > 40 ? 0.8 : 1;
            const mainFontSize = 'clamp(' + (2.5 * densityScale * lyricsFontScale).toFixed(3) + 'rem, ' +
              (5.5 * densityScale * lyricsFontScale).toFixed(3) + 'vw, ' +
              (4.5 * densityScale * lyricsFontScale).toFixed(3) + 'rem)';
            const emptyFontSize = 'clamp(' + (1.2 * lyricsFontScale).toFixed(3) + 'rem, ' +
              (2.8 * lyricsFontScale).toFixed(3) + 'vw, ' +
              (1.9 * lyricsFontScale).toFixed(3) + 'rem)';

            const layoutVariants = buildGlowWordLayoutVariants(theme.animationIntensity);
            const bodyVariants = glowWordBodyVariants;

            const lyricContainerFloat = useMemo(() => {
              const configByIntensity = {
                calm: { distance: 10, duration: 8.5 },
                normal: { distance: 14, duration: 7 },
                chaotic: { distance: 18, duration: 5.8 },
              } as const;
              const { distance, duration } = configByIntensity[theme.animationIntensity];
              return {
                animate: {
                  y: [0, -distance, 0, distance * 0.45, 0],
                  scale: [1, 1.01, 1, 0.995, 1],
                },
                transition: { duration, repeat: Infinity, ease: 'easeInOut' as const },
              };
            }, [theme.animationIntensity]);

            return (
              <div
                className="partita-core relative w-full h-full flex items-center justify-center overflow-hidden"
                style={{ color: theme.primaryColor, minHeight: '100%', fontFamily: resolveThemeFontStack(theme) }}
                data-partita-core="true"
                data-debug-line-count={String(lines.length)}
                data-debug-current-line-index={String(currentLineIndex)}
                data-debug-active-line={activeLine ? 'true' : 'false'}
                data-debug-active-line-text={String(activeLine?.fullText ?? '')}
                data-debug-render-profile={activeLineRenderProfile ? 'true' : 'false'}
                data-debug-column-count={String(diagnosticColumnCount)}
                data-debug-chunk-count={String(diagnosticChunkCount)}
                data-debug-display-word-count={String(diagnosticDisplayWordCount)}
              >
                <motion.div
                  className="relative z-10 w-full h-[70vh] flex items-center justify-center p-8 pointer-events-none will-change-transform"
                  animate={lyricContainerFloat.animate}
                  transition={lyricContainerFloat.transition}
                >
                  {/* Render the active lyric directly. AnimatePresence has been
                      observed to drop this child under the standalone Preact compat
                      runtime, even when activeLine and layout data are valid. Keep
                      the motion elements themselves so lyric entrance/word animation
                      remains enabled; line-exit presence animation is temporarily
                      bypassed while validating the renderer. */}
                    {showText && activeLine && activeLineRenderProfile && (
                      <motion.div
                        key={activeLine.startTime}
                        initial={activeLineContainerMotion.initial}
                        animate={activeLineContainerMotion.animate}
                        custom={!showText}
                        variants={{ leave: (hidden: boolean) => (hidden ? TEXT_HIDDEN_EXIT : activeLineContainerMotion.exit) }}
                        exit="leave"
                        className="flex flex-row-reverse items-stretch justify-center w-full max-w-5xl"
                        style={{
                          perspective: sequentialLayout.lineConfig.perspective + 'px',
                          gap: sequentialLayout.lineConfig.columnGap,
                          minHeight: '320px',
                        }}
                      >
                        {sequentialLayout.columns.map((column) => (
                          <div
                            key={column.id}
                            className="relative flex min-h-[24rem] min-w-[3.8rem] items-center justify-center px-3"
                          >
                            <div className="relative z-10 flex flex-col items-center justify-start">
                              {column.words.map(({ chunkWords, displayWords, config, rowIndex }) => (
                                <PartitaChunk
                                  key={config.id}
                                  chunkWords={chunkWords}
                                  displayWords={displayWords}
                                  config={config}
                                  guideIndex={rowIndex}
                                  currentTime={currentTime}
                                  theme={theme}
                                  layoutVariants={layoutVariants}
                                  bodyVariants={bodyVariants}
                                  baseColor={theme.primaryColor}
                                  renderProfile={activeLineRenderProfile}
                                  isChorus={activeLine.isChorus}
                                  showGuideLines={resolvedPartitaTuning.showGuideLines}
                                  fontSize={mainFontSize}
                                />
                              ))}
                            </div>
                          </div>
                        ))}
                      </motion.div>
                    )}
                    {showText && activeLine && !activeLineRenderProfile && (
                      <div
                        key="profile-fallback"
                        className="relative z-10 text-center whitespace-pre-wrap"
                        style={{ color: theme.primaryColor, fontSize: mainFontSize }}
                        data-partita-profile-fallback="true"
                      >
                        {activeLine.fullText || (Array.isArray(activeLine.words) ? activeLine.words.map((word: any) => word.text || '').join('') : '')}
                      </div>
                    )}
                    {showText && !activeLine && (
                      <motion.div
                        key="empty"
                        initial={{ opacity: 0 }}
                        animate={{ opacity: 1 }}
                        exit={{ opacity: 0 }}
                        className="text-2xl opacity-50 absolute"
                        style={{ color: theme.secondaryColor, fontSize: emptyFontSize }}
                      />
                    )}
                </motion.div>
              </div>
            );
          };

          export default VisualizerPartitaCore;
          EOF

          echo "Standalone Partita rendering core created."

      - name: Create bundle entry points
        shell: bash
        run: |
          set -euo pipefail
          cd folia

          cat > vendor.ts <<'EOF'
          import * as React from "preact/compat";
          import * as ReactDOM from "preact/compat";
          import * as ReactDOMClient from "preact/compat/client";
          import {
            m,
            AnimatePresence,
            LazyMotion,
            domAnimation,
            useMotionValueEvent,
            motionValue,
            cancelFrame,
            frame,
            useSpring,
            useTransform,
          } from "framer-motion";

          const CompatReactDOM = Object.assign({}, ReactDOM, ReactDOMClient);
          const FramerMotion = {
            m,
            motion: m,
            AnimatePresence,
            LazyMotion,
            domAnimation,
            useMotionValueEvent,
            motionValue,
            cancelFrame,
            frame,
            useSpring,
            useTransform,
          };

          (window as any).Vendor = {
            React,
            ReactDOM: CompatReactDOM,
            FramerMotion
          };
          EOF

          cat > partita.ts <<'EOF'
          import "./vendor";
          import { createElement } from "preact/compat";
          import PartitaComponent from "./src/components/visualizer/partita/VisualizerPartitaCore";
          import {
            LazyMotion,
            domAnimation,
            motionValue
          } from "framer-motion";

          const WrappedPartita = (props: any) =>
            createElement(
              LazyMotion,
              {
                features: domAnimation,
                strict: true
              },
              createElement(PartitaComponent, props)
            );

          (window as any).Partita = {
            Component: WrappedPartita,
            default: WrappedPartita,
            // The host must create MotionValues from this same bundled runtime.
            motionValue
          };
          EOF

      - name: Build single-file Partita bundle
        shell: bash
        run: |
          set -euo pipefail
          cd folia

          # vendor.ts is imported by partita.ts; React-compat and Framer Motion
          # are bundled exactly once into the same IIFE as the complete renderer.
          # Tree-shaking remains disabled for this recovery build.

      - name: Build Partita bundle
        shell: bash
        run: |
          set -euo pipefail
          cd folia

          ./node_modules/.bin/esbuild partita.ts \
            --bundle \
            --format=iife \
            --minify \
            --tree-shaking=false \
            --target=es2020 \
            --jsx=automatic \
            --define:process.env.NODE_ENV='"production"' \
            --define:import.meta='{}' \
            --alias:react=preact/compat \
            --alias:react-dom=preact/compat \
            --alias:react/jsx-runtime=preact/jsx-runtime \
            --alias:virtual:folia-locale-zh-TW=./empty.js \
            --alias:lucide-react=./.my-shims/lucide.cjs \
            --alias:react-i18next=./.my-shims/i18n.cjs \
            --alias:opencc-js=./.my-shims/opencc.cjs \
            '--banner:js=var __folia_glob=function(){return {};};' \
            --loader:.css=empty \
            --loader:.png=dataurl \
            --loader:.jpg=dataurl \
            --loader:.svg=dataurl \
            --supported:dynamic-import=false \
            --metafile=../output/partita-meta.json \
            --outfile=../output/partita.js

      - name: Diagnose Partita bundle size
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('fs');
          const meta = JSON.parse(fs.readFileSync('output/partita-meta.json', 'utf8'));
          const target = Object.entries(meta.outputs || {}).find(([name]) => name.endsWith('/partita.js'));
          if (!target) {
            console.error('Could not find partita.js in esbuild metafile.');
            process.exit(1);
          }
          const [outputName, output] = target;
          const inputs = Object.entries(output.inputs || {})
            .map(([name, data]) => ({ name, bytes: data.bytesInOutput || 0 }))
            .sort((a, b) => b.bytes - a.bytes);
          console.log('Bundle size breakdown for ' + outputName + ':');
          for (const item of inputs.slice(0, 30)) {
            console.log(String(item.bytes).padStart(10) + ' bytes  ' + item.name);
          }
          NODE

      - name: Smoke-test bundle exports in a browser-like DOM
        shell: bash
        run: |
          set -euo pipefail
          NODE_PATH=folia/node_modules node <<'NODE'
          const fs = require('fs');
          const assert = require('assert');
          const { JSDOM } = require('jsdom');

          const dom = new JSDOM('<!doctype html><html><head></head><body><div id="mount-probe"></div><div id="partita-probe"></div></body></html>', {
            runScripts: 'outside-only',
            pretendToBeVisual: true,
            url: 'https://partita-smoke.local/index.html'
          });
          const w = dom.window;
          const errors = [];
          w.addEventListener('error', event => errors.push(event.message));

          for (const file of [
            'output/partita.js'
          ]) {
            try {
              const source = fs.readFileSync(file, 'utf8');
              require('vm').runInContext(source, dom.getInternalVMContext(), { filename: file });
            } catch (error) {
              const stack = String(error && error.stack || '').split('\\n')
                .filter(line => line.length < 500).slice(0, 8).join('\\n');
              console.error('BUNDLE LOAD FAILED: ' + file);
              console.error((error && error.name || 'Error') + ': ' + (error && error.message || String(error)));
              if (stack) console.error(stack);
              process.exit(1);
            }
          }

          assert.ok(w.Vendor, 'window.Vendor was not initialized');
          assert.ok(w.Vendor.FramerMotion, 'window.Vendor.FramerMotion was not initialized');
          assert.equal(typeof w.Vendor.FramerMotion.motionValue, 'function', 'Vendor Framer Motion motionValue must be real');
          assert.equal(typeof w.Vendor.FramerMotion.useMotionValueEvent, 'function', 'Vendor Framer Motion useMotionValueEvent must be real');
          assert.ok(w.Partita, 'window.Partita was not initialized');
          assert.equal(typeof w.Partita.Component, 'function', 'Partita.Component must be callable');
          assert.equal(typeof w.Partita.default, 'function', 'Partita.default must be callable');
          assert.equal(typeof w.Partita.motionValue, 'function', 'Partita.motionValue must be callable');
          assert.strictEqual(w.Partita.motionValue, w.Vendor.FramerMotion.motionValue,
            'Partita and the host must share the exact same Framer Motion motionValue factory');
          assert.equal(typeof w.Vendor.ReactDOM.createRoot, 'function', 'ReactDOM.createRoot must be callable');
          assert.equal(errors.length, 0, 'Runtime errors: ' + errors.join('; '));

          const root = w.Vendor.ReactDOM.createRoot(w.document.getElementById('mount-probe'));
          root.render(w.Vendor.React.createElement('div', { id: 'partita-mount-probe' }, 'ok'));
          assert.ok(w.document.getElementById('partita-mount-probe'), 'createRoot could not mount a DOM node');

          // Exercise the actual Partita component with the MotionValue contract
          // it expects, rather than treating exported globals as sufficient proof.
          const mv = w.Partita.motionValue;
          const theme = {
            name: 'Smoke', backgroundColor: '#000000', primaryColor: '#ffffff',
            accentColor: '#8fb0ff', secondaryColor: '#999999',
            fontStyle: 'sans', animationIntensity: 'normal'
          };
          const currentTime = mv(1);
          let motionValueEventCount = 0;
          const stopMotionValueProbe = currentTime.on('change', () => { motionValueEventCount += 1; });
          currentTime.set(1.25);
          assert.equal(motionValueEventCount, 1, 'Real Framer Motion MotionValue change events must fire');
          stopMotionValueProbe();
          currentTime.set(1);
          const audioBands = {
            bass: mv(0), lowMid: mv(0), mid: mv(0), vocal: mv(0), treble: mv(0)
          };
          const lines = [{
            startTime: 0, endTime: 4, fullText: '云阶',
            words: [{ text: '云阶', startTime: 0, endTime: 4 }]
          }];
          const partitaRoot = w.Vendor.ReactDOM.createRoot(w.document.getElementById('partita-probe'));
          partitaRoot.render(w.Vendor.React.createElement(w.Partita.default, {
            currentTime,
            currentLineIndex: 0,
            lines,
            theme,
            subtitleTheme: theme,
            audioPower: mv(0),
            audioBands,
            showText: true
          }));
          const partitaProbe = w.document.getElementById('partita-probe');
          assert.ok(partitaProbe.childNodes.length > 0,
            'Partita component did not render into the DOM');
          const coreProbe = partitaProbe.querySelector('[data-partita-core="true"]');
          assert.ok(coreProbe, 'Standalone Partita core root was not rendered');

          const diagnostics = {
            lineCount: coreProbe.getAttribute('data-debug-line-count'),
            currentLineIndex: coreProbe.getAttribute('data-debug-current-line-index'),
            activeLine: coreProbe.getAttribute('data-debug-active-line'),
            activeLineText: coreProbe.getAttribute('data-debug-active-line-text'),
            renderProfile: coreProbe.getAttribute('data-debug-render-profile'),
            columns: coreProbe.getAttribute('data-debug-column-count'),
            chunks: coreProbe.getAttribute('data-debug-chunk-count'),
            displayWords: coreProbe.getAttribute('data-debug-display-word-count'),
            renderedText: partitaProbe.textContent,
            html: partitaProbe.innerHTML.slice(0, 1600)
          };
          console.log('PARTITA RENDER DIAGNOSTICS: ' + JSON.stringify(diagnostics));

          assert.ok(partitaProbe.textContent.includes('云阶'),
            'Partita rendered no lyric text. Diagnostics: ' + JSON.stringify(diagnostics));
          assert.equal(errors.length, 0, 'Runtime errors: ' + errors.join('; '));

          console.log('PASS: Real Framer Motion runtime, MotionValue events, Partita core mount, and visible lyric text 云阶.');
          dom.window.close();
          NODE

      - name: Verify bundle sizes
        shell: bash
        run: |
          set -euo pipefail

          # Recovery build favors runtime completeness over size. Report, do not block,
          # when the single-file bundle exceeds the 3 MB target.
          TARGET_BYTES=3000000
          total=0

          for file in output/partita.js
          do
            if [ ! -s "$file" ]; then
              echo "::error::Missing or empty bundle: $file"
              exit 1
            fi
            size=$(wc -c < "$file" | tr -d ' ')
            echo "$file: $size bytes"
            total=$((total + size))
          done

          echo "Single-file Partita size: $total bytes"
          if [ "$total" -ge "$TARGET_BYTES" ]; then
            echo "::warning::Bundle exceeds the 3,000,000-byte target; validate WKWebView memory before adoption."
          else
            echo "PASS: Single-file bundle is within the 3,000,000-byte target."
          fi

      - name: Create package manifest
        shell: bash
        run: |
          set -euo pipefail

          cat > output/README.txt <<'EOF'
          Partita Single-File Recovery Bundle

          Files:
          - partita.js: Preact compatibility runtime, real Framer Motion runtime, and complete Partita renderer in one IIFE
          - partita-meta.json: esbuild bundle metadata

          Load partita.js only.
          Full OpenCC dictionary conversion is intentionally omitted; text conversion requests pass through unchanged.

          The host must provide Preact mount integration and valid Partita props.
          Create every MotionValue prop with window.Vendor.FramerMotion.motionValue(...)
          or its identical alias window.Partita.motionValue(...), from this same
          real Framer Motion runtime: currentTime, audioPower, and audioBands.bass,
          lowMid, mid, vocal, and treble. Update them with .set(value).
          The theme must include name, backgroundColor, primaryColor, accentColor,
          secondaryColor, fontStyle, and animationIntensity. Lines must use Folia's
          Line shape: words, startTime, endTime, and fullText.

          This package is a JavaScript bundle, not a signed iOS IPA.
          The automated smoke test checks global exports and a Preact mount; actual
          Partita rendering and local WKWebView behavior still require host testing.
          EOF

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: partita-split-bundle
          path: output/
          if-no-files-found: error
          compression-level: 9
          retention-days: 7
