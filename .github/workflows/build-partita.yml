
name: Build Partita Split

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-partita.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download Folia-Plain
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            https://github.com/ithtelab/Folia-Plain/archive/41e178bc38597440d64c65bc2ae660ae07cac104.zip \
            -o folia.zip
          unzip -q folia.zip
          mv Folia-Plain-41e178bc38597440d64c65bc2ae660ae07cac104 folia

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd folia
          npm install --legacy-peer-deps --ignore-scripts
          npm install --no-save --legacy-peer-deps preact esbuild framer-motion jsdom
          mkdir -p .my-shims ../output

      - name: Create compatibility shims
        shell: bash
        run: |
          set -euo pipefail
          cd folia

          printf 'export default {};\n' > empty.js

          cat > .my-shims/lucide.cjs <<'EOF'
          module.exports = new Proxy({}, {
            get: function () {
              return function () {
                return null;
              };
            }
          });
          EOF

          cat > .my-shims/i18n.cjs <<'EOF'
          const i18n = {
            t: function (key) { return key; },
            language: 'en',
            resolvedLanguage: 'en',
            on: function () {},
            off: function () {},
            changeLanguage: function () { return Promise.resolve('en'); }
          };

          module.exports = {
            useTranslation: function () {
              return { t: i18n.t, i18n };
            },
            initReactI18next: {
              type: '3rdParty',
              init: function () {}
            },
            getI18n: function () { return i18n; },
            Trans: function (props) { return (props && props.children) || null; },
            I18nextProvider: function (props) { return (props && props.children) || null; }
          };
          EOF

          cat > .my-shims/framer-motion-lite.ts <<'EOF'
          // Keep the Partita bundle on Framer Motion's lightweight m API.
          // The visualizer only needs these runtime exports; MotionValue and
          // Variants are TypeScript-only imports and are erased during bundling.
          import {
            m,
            AnimatePresence,
            LazyMotion,
            domAnimation,
            useMotionValueEvent,
            motionValue,
            cancelFrame,
            frame,
            useSpring,
            useTransform,
          } from "framer-motion";

          export {
            m,
            AnimatePresence,
            LazyMotion,
            domAnimation,
            useMotionValueEvent,
            motionValue,
            cancelFrame,
            frame,
            useSpring,
            useTransform,
          };
          export const motion = m;
          export type * from "framer-motion";
          EOF

          find src -type f \( -name "*.ts" -o -name "*.tsx" \) \
            -exec sed -i \
            "s/from ['\"]framer-motion['\"]/from 'partita-framer-motion-lite'/g" {} +

          echo "Compatibility shims created."

      - name: Stub Vite-only registries for the standalone Partita bundle
        shell: bash
        run: |
          set -euo pipefail
          cd folia

          # esbuild does not implement Vite's import.meta.glob. Restrict the
          # replacement to source call sites, then provide small registries
          # for this standalone Partita-only bundle.
          find src -type f \( -name "*.ts" -o -name "*.tsx" \) \
            -exec sed -i "s/import\\.meta\\.glob/__folia_glob/g" {} +

          cat > src/components/visualizer/backgrounds/registry.tsx <<'EOF'
          // Standalone bundle registry: retain the expected latent default id,
          // but omit the heavyweight background renderer from this lyric-only build.
          const fallbackEntry: any = {
            mode: 'latent',
            order: 35,
            labelKey: 'options.visualizerBackgroundModeLatent',
            labelFallback: 'Latent',
            render: () => null,
          };
          const byMode: Record<string, any> = { latent: fallbackEntry };
          export const VISUALIZER_BACKGROUND_REGISTRY = [fallbackEntry];
          export const DEFAULT_VISUALIZER_BACKGROUND_MODE = 'latent';
          export const hasVisualizerBackgroundMode = (mode: unknown) =>
            typeof mode === 'string' && Boolean(byMode[mode]);
          export const getVisualizerBackgroundRegistryEntry = (mode: string) =>
            byMode[mode] || fallbackEntry;
          export const getVisualizerBackgroundModeLabel = (mode: string, t: (key: string) => string) => {
            const entry = getVisualizerBackgroundRegistryEntry(mode);
            const translated = t(entry.labelKey);
            return !translated || translated === entry.labelKey ? entry.labelFallback : translated;
          };
          export const appendVisualizerBackgroundEntry = (entry: any) => {
            if (byMode[entry.mode]) return false;
            byMode[entry.mode] = entry;
            VISUALIZER_BACKGROUND_REGISTRY.push(entry);
            VISUALIZER_BACKGROUND_REGISTRY.sort((a: any, b: any) => a.order - b.order);
            return true;
          };
          export const removeVisualizerBackgroundEntry = (mode: string) => {
            if (!byMode[mode]) return false;
            delete byMode[mode];
            const index = VISUALIZER_BACKGROUND_REGISTRY.findIndex((entry: any) => entry.mode === mode);
            if (index >= 0) VISUALIZER_BACKGROUND_REGISTRY.splice(index, 1);
            return true;
          };
          EOF

          cat > src/components/visualizer/registry.tsx <<'EOF'
          // Standalone bundle registry: the host embeds only Partita.
          const fallbackEntry: any = {
            mode: 'partita',
            order: 50,
            labelKey: 'ui.visualizerPartita',
            labelFallback: '云阶',
            previewStartOffset: 0,
            previewSeed: 'partita',
            render: () => null,
          };
          const byMode: Record<string, any> = { partita: fallbackEntry };
          export const VISUALIZER_REGISTRY = [fallbackEntry];
          export const DEFAULT_VISUALIZER_MODE = 'partita';
          export const hasVisualizerMode = (mode: string | null | undefined) =>
            Boolean(mode && byMode[mode]);
          export const getVisualizerRegistryEntry = (mode: string) =>
            byMode[mode] || fallbackEntry;
          export const getVisualizerModeLabel = (mode: string, t: (key: string) => string) => {
            const entry = getVisualizerRegistryEntry(mode);
            const translated = t(entry.labelKey);
            return !translated || translated === entry.labelKey ? entry.labelFallback : translated;
          };
          export const getVisualizerPreviewStartOffset = () => 0;
          export const getVisualizerScopedSeed = (mode: string, scope: string) => `${scope}-${mode}`;
          export const appendVisualizerEntry = () => false;
          export const removeVisualizerEntry = () => false;
          EOF

          echo "Partita-only registries installed."

      - name: Create bundle entry points
        shell: bash
        run: |
          set -euo pipefail
          cd folia

          cat > vendor.ts <<'EOF'
          import * as React from "preact/compat";
          import * as ReactDOM from "preact/compat";
          import * as ReactDOMClient from "preact/compat/client";

          const CompatReactDOM = Object.assign({}, ReactDOM, ReactDOMClient);

          (window as any).Vendor = {
            React,
            ReactDOM: CompatReactDOM
          };
          EOF

          cat > partita.ts <<'EOF'
          import { createElement } from "preact/compat";
          import PartitaComponent from "./src/components/visualizer/partita/VisualizerPartita";
          import {
            LazyMotion,
            domAnimation,
            motionValue
          } from "./.my-shims/framer-motion-lite";

          const WrappedPartita = (props: any) =>
            createElement(
              LazyMotion,
              {
                features: domAnimation,
                strict: true
              },
              createElement(PartitaComponent, props)
            );

          (window as any).Partita = {
            Component: WrappedPartita,
            default: WrappedPartita,
            // The host must create MotionValues from this same bundled runtime.
            motionValue
          };
          EOF

      - name: Build OpenCC bundle
        shell: bash
        run: |
          set -euo pipefail
          cd folia

          cat > opencc-vendor.ts <<'EOF'
          import * as OpenCC from "opencc-js";

          (window as any).OpenCC = OpenCC;
          EOF

          ./node_modules/.bin/esbuild opencc-vendor.ts \
            --bundle \
            --format=iife \
            --minify \
            --tree-shaking=true \
            --target=es2020 \
            --outfile=../output/partita-opencc.js

      - name: Build vendor bundle
        shell: bash
        run: |
          set -euo pipefail
          cd folia

          ./node_modules/.bin/esbuild vendor.ts \
            --bundle \
            --format=iife \
            --global-name=PartitaVendorBundle \
            --minify \
            --tree-shaking=true \
            --target=es2020 \
            --alias:react=preact/compat \
            --alias:react-dom=preact/compat \
            --outfile=../output/partita-vendor.js

      - name: Build Partita bundle
        shell: bash
        run: |
          set -euo pipefail
          cd folia

          ./node_modules/.bin/esbuild partita.ts \
            --bundle \
            --format=iife \
            --minify \
            --tree-shaking=true \
            --target=es2020 \
            --jsx=automatic \
            --define:process.env.NODE_ENV='"production"' \
            --define:import.meta='{}' \
            --alias:react=preact/compat \
            --alias:react-dom=preact/compat \
            --alias:react/jsx-runtime=preact/jsx-runtime \
            --alias:partita-framer-motion-lite=./.my-shims/framer-motion-lite.ts \
            --alias:virtual:folia-locale-zh-TW=./empty.js \
            --alias:lucide-react=./.my-shims/lucide.cjs \
            --alias:react-i18next=./.my-shims/i18n.cjs \
            --external:preact/compat \
            --external:opencc-js \
            '--banner:js=var __folia_glob=function(){return {};};var require=function(m){if(m==="preact/compat"||m==="react"||m==="react-dom")return window.Vendor.React;if(m==="opencc-js")return window.OpenCC;return {};};' \
            --loader:.css=empty \
            --loader:.png=dataurl \
            --loader:.jpg=dataurl \
            --loader:.svg=dataurl \
            --supported:dynamic-import=false \
            --metafile=../output/partita-meta.json \
            --outfile=../output/partita.js

      - name: Diagnose Partita bundle size
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('fs');
          const meta = JSON.parse(fs.readFileSync('output/partita-meta.json', 'utf8'));
          const target = Object.entries(meta.outputs || {}).find(([name]) => name.endsWith('/partita.js'));
          if (!target) {
            console.error('Could not find partita.js in esbuild metafile.');
            process.exit(1);
          }
          const [outputName, output] = target;
          const inputs = Object.entries(output.inputs || {})
            .map(([name, data]) => ({ name, bytes: data.bytesInOutput || 0 }))
            .sort((a, b) => b.bytes - a.bytes);
          console.log('Bundle size breakdown for ' + outputName + ':');
          for (const item of inputs.slice(0, 30)) {
            console.log(String(item.bytes).padStart(10) + ' bytes  ' + item.name);
          }
          NODE

      - name: Smoke-test bundle exports in a browser-like DOM
        shell: bash
        run: |
          set -euo pipefail
          NODE_PATH=folia/node_modules node <<'NODE'
          const fs = require('fs');
          const assert = require('assert');
          const { JSDOM } = require('jsdom');

          const dom = new JSDOM('<!doctype html><html><head></head><body></body></html>', {
            runScripts: 'outside-only',
            url: 'https://partita-smoke.local/index.html'
          });
          const w = dom.window;
          const errors = [];
          w.addEventListener('error', event => errors.push(event.message));

          for (const file of [
            'output/partita-vendor.js',
            'output/partita-opencc.js',
            'output/partita.js'
          ]) {
            const source = fs.readFileSync(file, 'utf8');
            require('vm').runInContext(source, dom.getInternalVMContext(), { filename: file });
          }

          assert.ok(w.Vendor, 'window.Vendor was not initialized');
          assert.ok(w.OpenCC, 'window.OpenCC was not initialized');
          assert.ok(w.Partita, 'window.Partita was not initialized');
          assert.equal(typeof w.Partita.Component, 'function', 'Partita.Component must be callable');
          assert.equal(typeof w.Partita.default, 'function', 'Partita.default must be callable');
          assert.equal(typeof w.Partita.motionValue, 'function', 'Partita.motionValue must be callable');
          assert.equal(typeof w.Vendor.ReactDOM.createRoot, 'function', 'ReactDOM.createRoot must be callable');
          assert.equal(errors.length, 0, 'Runtime errors: ' + errors.join('; '));

          const root = w.Vendor.ReactDOM.createRoot(w.document.body);
          root.render(w.Vendor.React.createElement('div', { id: 'partita-mount-probe' }, 'ok'));
          assert.ok(w.document.getElementById('partita-mount-probe'), 'createRoot could not mount a DOM node');

          console.log('PASS: Vendor, OpenCC, Partita exports and createRoot mount.');
          dom.window.close();
          NODE

      - name: Verify bundle sizes
        shell: bash
        run: |
          set -euo pipefail

          MAX_BYTES=3000000

          for file in \
            output/partita-opencc.js \
            output/partita-vendor.js \
            output/partita.js
          do
            if [ ! -s "$file" ]; then
              echo "::error::Missing or empty bundle: $file"
              exit 1
            fi

            size=$(wc -c < "$file" | tr -d ' ')
            echo "$file: $size bytes"

            if [ "$size" -ge "$MAX_BYTES" ]; then
              echo "::error::$file exceeds the 3,000,000-byte limit"
              exit 1
            fi
          done

          echo "Both JavaScript bundles passed the size check."

      - name: Create package manifest
        shell: bash
        run: |
          set -euo pipefail

          cat > output/README.txt <<'EOF'
          Partita Split Bundle

          Files:
          - partita-opencc.js: OpenCC simplified/traditional Chinese conversion runtime
          - partita-vendor.js: Preact compatibility runtime
          - partita.js: Partita visualizer and its selected dependencies
          - partita-meta.json: esbuild bundle metadata

          Load partita-opencc.js and partita-vendor.js before partita.js.
          The OpenCC runtime is exposed as window.OpenCC.

          The host must provide Preact mount integration and valid Partita props.
          Create every MotionValue prop with window.Partita.motionValue(...), from
          this same bundle runtime: currentTime, audioPower, and audioBands.bass,
          lowMid, mid, vocal, and treble. Update them with .set(value).
          The theme must include name, backgroundColor, primaryColor, accentColor,
          secondaryColor, fontStyle, and animationIntensity. Lines must use Folia's
          Line shape: words, startTime, endTime, and fullText.

          This package is a JavaScript bundle, not a signed iOS IPA.
          The automated smoke test checks global exports and a Preact mount; actual
          Partita rendering and local WKWebView behavior still require host testing.
          EOF

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: partita-split-bundle
          path: output/
          if-no-files-found: error
          compression-level: 9
          retention-days: 7
