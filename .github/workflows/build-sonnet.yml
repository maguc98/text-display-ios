name: Build Sonnet JS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download Folia source
        run: |
          curl -L https://github.com/chthollyphile/folia-major/archive/refs/heads/main.zip -o folia.zip
          unzip -q folia.zip
          mv folia-major-main folia

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Esbuild
        run: |
          cd folia
          npm install
          cd ..
          npm install -g esbuild

      # ====== 新增：创建一个 Pixi 的替身垫片 ======
      - name: Create Pixi ShIM
        run: |
          echo "module.exports = window.PIXI;" > folia/src/components/visualizer/sonnet/pixi-shim.js

      - name: Create Entry File
        run: |
          cat << 'EOF' > folia/src/components/visualizer/sonnet/bundle-entry.ts
          import * as SonnetModule from './createSonnetPixiRuntime';
          // 将模块挂载到全局
          (window as any).SonnetRuntime = SonnetModule;
          EOF

      # ====== 修改：打包时剥离 pixi.js，并指向垫片 ======
      - name: Build Sonnet JS
        run: |
          mkdir -p output
          esbuild folia/src/components/visualizer/sonnet/bundle-entry.ts \
            --bundle \
            --format=iife \
            --global-name=SonnetRuntime \
            --external:pixi.js \
            --alias:pixi.js=./folia/src/components/visualizer/sonnet/pixi-shim.js \
            --outfile=output/sonnet.js

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonnet-bundle
          path: output/sonnet.js
