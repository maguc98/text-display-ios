name: Build Sonnet JS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download Folia source
        run: |
          curl -L https://github.com/chthollyphile/folia-major/archive/refs/heads/main.zip -o folia.zip
          unzip -q folia.zip
          mv folia-major-main folia

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Esbuild
        run: |
          cd folia
          npm install
          cd ..
          npm install -g esbuild

      - name: Create Mock React & Entry
        run: |
          node -e "require('fs').writeFileSync('folia/react-mock.js', 'module.exports = { createElement: function(){ return { props: {} }; }, Fragment: {}, Component: function(){} };')"
          node -e "require('fs').writeFileSync('folia/react-dom-mock.js', 'module.exports = { renderToStaticMarkup: function(){ return \"\"; } };')"
          node -e "require('fs').writeFileSync('folia/src/components/visualizer/sonnet/bundle-entry.ts', 'import * as SonnetFiles from \"./createSonnetPixiRuntime\"; import { compileSonnetProgram } from \"./sonnetProgram\"; window.SonnetRuntime = { ...SonnetFiles, compileSonnetProgram };')"

      - name: Build Sonnet JS
        run: |
          mkdir -p output
          npx esbuild folia/src/components/visualizer/sonnet/bundle-entry.ts --bundle --format=iife --global-name=SonnetRuntime --tree-shaking=false --loader:.tsx=tsx --loader:.ts=ts --define:process.env.NODE_ENV='"production"' --alias:react=./folia/react-mock.js --alias:react-dom/server=./folia/react-dom-mock.js --external:lucide-react --external:react-i18next --outfile=output/sonnet.js

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonnet-bundle
          path: output/sonnet.js
