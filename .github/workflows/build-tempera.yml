name: Build Tempera JS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download Folia source
        run: |
          curl -L https://github.com/chthollyphile/folia-major/archive/refs/heads/main.zip -o folia.zip
          unzip -q folia.zip
          mv folia-major-main folia

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Esbuild
        run: |
          cd folia
          npm install
          cd ..
          npm install -g esbuild

      - name: Create Dummy File
        run: echo "export default {};" > folia/empty.js

      - name: Create Entry File
        run: |
          cat << 'EOF' > folia/src/components/visualizer/tempera/bundle-entry-tempera.ts
          import * as TemperaFiles from "./createTemperaPixiRuntime";
          import { compileTemperaProgram } from "./temperaProgram";
          window.TemperaRuntime = { ...TemperaFiles, compileTemperaProgram };
          EOF

      - name: Build Tempera JS
        run: |
          mkdir -p output
          npx esbuild folia/src/components/visualizer/tempera/bundle-entry-tempera.ts --bundle --format=iife --platform=browser --target=es2020 --charset=ascii --legal-comments=none --tree-shaking=true --minify --loader:.tsx=tsx --loader:.ts=ts --loader:.json=json --loader:.css=empty --define:process.env.NODE_ENV='"production"' --define:import.meta='{}' --alias:virtual:folia-locale-zh-TW=./folia/empty.js --external:react --external:react-dom --external:react-dom/server --external:react/jsx-runtime --external:framer-motion --external:lucide-react --external:react-i18next --banner:js="var require = function(m) { if(m==='react' || m==='react/jsx-runtime') return {createElement:function(){return {props:{}}}, jsx:function(){return {props:{}}}, jsxs:function(){return {props:{}}}, Fragment:{}, Component:function(){}}; if(m==='react-dom/server') return {renderToStaticMarkup:function(){return ''}}; return {}; }; var __require = require;" --outfile=output/tempera.js

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tempera-bundle
          path: output/tempera.js
