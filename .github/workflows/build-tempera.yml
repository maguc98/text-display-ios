- name: Build Tempera JS
        run: |
          mkdir -p output
          npx esbuild folia/src/components/visualizer/tempera/bundle-entry-tempera.ts \
            --bundle \
            --format=iife \
            --global-name=TemperaRuntime \
            --tree-shaking=false \
            --loader:.tsx=tsx \
            --loader:.ts=ts \
            --define:process.env.NODE_ENV='"production"' \
            --define:import.meta='({ env: { DEV: false, PROD: true, MODE: "production" } })' \
            --external:react \
            --external:react-dom \
            --external:react-dom/server \
            --external:react/jsx-runtime \
            --external:framer-motion \
            --external:lucide-react \
            --external:react-i18next \
            --external:virtual:* \
            --banner:js="var require = function(m) { if(m==='react' || m==='react/jsx-runtime') return {createElement:function(){return {props:{}}}, jsx:function(){return {props:{}}}, jsxs:function(){return {props:{}}}, Fragment:{}, Component:function(){}}; if(m==='react-dom/server') return {renderToStaticMarkup:function(){return ''}}; if(m.indexOf('virtual:')===0) return {}; return {}; }; var __require = require;" \
            --outfile=output/tempera.js
