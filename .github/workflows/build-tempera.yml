name: Build Tempera JS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download Folia source
        run: |
          curl -L https://github.com/chthollyphile/folia-major/archive/refs/heads/main.zip -o folia.zip
          unzip -q folia.zip
          mv folia-major-main folia

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Esbuild
        run: |
          cd folia
          npm install
          cd ..
          npm install -g esbuild

      - name: Create Dummy File for Virtual Modules
        run: echo "export default {};" > folia/empty.js

      - name: Create Entry File
        run: |
          cat << 'EOF' > folia/src/components/visualizer/tempera/bundle-entry-tempera.ts
          import { TemperaPixiRuntime } from "./createTemperaPixiRuntime";
          const globalObject = (typeof globalThis !== "undefined" ? globalThis : window) as any;
          const previous = globalObject.TemperaRuntime as any;
          globalObject.TemperaRuntime = Object.assign(TemperaPixiRuntime, {
            __booted: true,
            __placeholder: false,
            __bootLog: (previous && previous.__bootLog) || globalObject.__temperaBootLog || []
          });
          EOF

      - name: Build Tempera JS
        run: |
          mkdir -p output
          npx esbuild folia/src/components/visualizer/tempera/bundle-entry-tempera.ts \
            --bundle \
            --format=iife \
            --platform=browser \
            --target=es2020 \
            --charset=ascii \
            --legal-comments=none \
            --tree-shaking=true \
            --minify \
            --loader:.tsx=tsx \
            --loader:.ts=ts \
            --loader:.json=json \
            --loader:.css=empty \
            --define:process.env.NODE_ENV='"production"' \
            --alias:virtual:folia-locale-zh-TW=./folia/empty.js \
            --external:react \
            --external:react-dom \
            --external:react-dom/server \
            --external:react/jsx-runtime \
            --external:framer-motion \
            --external:lucide-react \
            --external:react-i18next \
            --banner:js="var require = function(m) { if(m==='react' || m==='react/jsx-runtime') return {createElement:function(){return {props:{}}}, jsx:function(){return {props:{}}}, jsxs:function(){return {props:{}}}, Fragment:{}, Component:function(){}}; if(m==='react-dom/server') return {renderToStaticMarkup:function(){return ''}}; return {}; }; var __require = require; ;(function(){var w=typeof window!=='undefined'?window:globalThis;w.__temperaBootLog=w.__temperaBootLog||[];w.__temperaBootLog.push('tempera.js: bundle start');})();" \
            --footer:js=";(function(){var w=typeof window!=='undefined'?window:globalThis;w.__temperaBootLog=w.__temperaBootLog||[];w.__temperaBootLog.push('tempera.js: bundle end TemperaRuntime='+typeof w.TemperaRuntime);})();" \
            --outfile=output/tempera.js

      - name: Assert bundle is file:// safe
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'output/tempera.js';
          const s = fs.readFileSync(path, 'utf8');
          const fails = [];
          if (/\bimport\s*\(/.test(s)) fails.push('contains dynamic import()');
          if (/(^|\n)\s*import\s+[\w{*]/.test(s)) fails.push('contains top-level import statement');
          if (/(^|\n)\s*export\s+[\w{*]/.test(s)) fails.push('contains export statement');
          if (s.includes('import.meta')) fails.push('contains import.meta');
          if (fails.length) {
            console.error('Bundle is NOT file:// safe:\n - ' + fails.join('\n - '));
            process.exit(1);
          }
          new Function(s);
          console.log('Bundle OK: parse passed, bytes =', s.length);
          NODE

      - name: Write Tempera boot shim
        run: |
          cat << 'EOF' > output/tempera-boot.js
          (function () {
            var w = typeof window !== 'undefined' ? window : globalThis;
            w.__temperaBootLog = w.__temperaBootLog || [];
            function log(m) { try { w.__temperaBootLog.push(String(m)); } catch (e) {} }
            log('tempera-boot: start');

            if (!Array.prototype.at) {
              Object.defineProperty(Array.prototype, 'at', { configurable: true, writable: true, value: function at(n) {
                var len = this.length >>> 0; n = Math.trunc(n) || 0; if (n < 0) n += len;
                return (n < 0 || n >= len) ? undefined : this[n];
              }});
            }
            if (!String.prototype.at) {
              Object.defineProperty(String.prototype, 'at', { configurable: true, writable: true, value: function at(n) {
                var s = String(this), len = s.length; n = Math.trunc(n) || 0; if (n < 0) n += len;
                return (n < 0 || n >= len) ? undefined : s.charAt(n);
              }});
            }
            if (!Object.hasOwn) {
              Object.hasOwn = function (o, p) { return Object.prototype.hasOwnProperty.call(o, p); };
            }
            if (!Array.prototype.findLast) {
              Object.defineProperty(Array.prototype, 'findLast', { configurable: true, writable: true, value: function (p, t) {
                for (var i = this.length - 1; i >= 0; i--) if (p.call(t, this[i], i, this)) return this[i];
                return undefined;
              }});
            }
            if (!Array.prototype.findLastIndex) {
              Object.defineProperty(Array.prototype, 'findLastIndex', { configurable: true, writable: true, value: function (p, t) {
                for (var i = this.length - 1; i >= 0; i--) if (p.call(t, this[i], i, this)) return i;
                return -1;
              }});
            }
            if (!String.prototype.replaceAll) {
              String.prototype.replaceAll = function (search, replacement) {
                var s = String(this);
                if (search instanceof RegExp) {
                  if (!search.global) throw new TypeError('replaceAll must be called with a global RegExp');
                  return s.replace(search, replacement);
                }
                return s.split(String(search)).join(String(replacement));
              };
            }
            if (typeof Promise.withResolvers !== 'function') {
              Promise.withResolvers = function () {
                var resolve, reject;
                var promise = new Promise(function (r, j) { resolve = r; reject = j; });
                return { promise: promise, resolve: resolve, reject: reject };
              };
            }
            if (typeof structuredClone === 'undefined') {
              w.structuredClone = function (v) { return v === undefined ? v : JSON.parse(JSON.stringify(v)); };
            }
            if (!w.TemperaRuntime) {
              w.TemperaRuntime = {
                __placeholder: true,
                __booted: false,
                create: function () {
                  return Promise.reject(new Error('TemperaRuntime not booted yet. Check window.__temperaBootLog.'));
                }
              };
            }
            w.addEventListener('error', function (e) {
              log('window.error: ' + (e && (e.message || e.error || e)));
            }, true);
            w.addEventListener('unhandledrejection', function (e) {
              log('unhandledrejection: ' + (e && e.reason ? e.reason : e));
            });
            log('tempera-boot: done');
          })();
          EOF

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tempera-bundle
          path: |
            output/tempera.js
            output/tempera-boot.js
