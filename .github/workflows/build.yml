name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate --spec project.yml

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project TextDisplay.xcodeproj \
            -scheme TextDisplay \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package app for inspection
        run: |
          mkdir -p output
          cd build/Build/Products/Release-iphoneos
          ls -la
          /usr/bin/zip -r "$GITHUB_WORKSPACE/output/TextDisplay-unsigned.zip" *.app

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TextDisplay-unsigned
          path: output/TextDisplay-unsigned.zip
