name: TextDisplay

options:
  bundleIdPrefix: com.maguc98
  deploymentTarget:
    iOS: "15.0"

targets:
  TextDisplay:
    type: application
    platform: iOS
    sources:
      - path: TextDisplayApp.swift
      - path: index.html
        buildPhase: resources
      - path: style.css
        buildPhase: resources
      - path: app.js
        buildPhase: resources
      - path: Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maguc98.textdisplay
        GENERATE_INFOPLIST_FILE: YES
        
        # 👇 就是这一行，改成了 Yiu.fm
        INFOPLIST_KEY_CFBundleDisplayName: Yiu.fm
        
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
