name: TextDisplay

options:
  bundleIdPrefix: com.maguc98
  deploymentTarget:
    iOS: "15.0"

targets:
  TextDisplay:
    type: application
    platform: iOS
    sources:
      - path: TextDisplayApp.swift
      - path: index.html
        buildPhase: resources
      - path: style.css
        buildPhase: resources
      - path: app.js
        buildPhase: resources
      # 👇 这一行：把刚才建的图标文件夹当成资源引入
      - path: Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maguc98.textdisplay
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 文字显示器
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        
        # 👇 核心：告诉 Xcode 使用 Assets 里的 AppIcon
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
