name: TextDisplay

options:
  bundleIdPrefix: com.maguc98
  deploymentTarget:
    iOS: "15.0"

targets:
  TextDisplay:
    type: application
    platform: iOS
    sources:
      - path: TextDisplayApp.swift
      - path: index.html
        buildPhase: resources
      - path: style.css
        buildPhase: resources
      - path: app.js
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maguc98.textdisplay
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 文字显示器
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        # 解决黑边和强制全屏的核心配置
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
